    .jobs-workspace{display:grid;grid-template-columns:minmax(440px,1fr) 440px;gap:16px;align-items:start}.jobs-panel{min-width:0}.filters{padding:13px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1.6fr repeat(3,minmax(128px,1fr));gap:8px}.filters .filter-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;padding-top:2px}.list{max-height:calc(100vh - 292px);overflow:auto}.job{padding:15px 17px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .18s ease}.job:hover,.job.selected{background:#f7faff}.job-row{display:flex;justify-content:space-between;gap:12px}.job h3{font-size:15px;margin:0 0 3px}.job .company{font-weight:650}.pill,.source-tag{display:inline-flex;align-items:center;border-radius:999px;background:var(--soft);color:var(--blue);padding:4px 8px;font-size:11px;font-weight:700;white-space:nowrap}.source-tag{background:#f3f0ff;color:#7045b5;margin-right:6px}.pill.amber{background:#fff5e6;color:var(--amber)}.pill.green{background:#e9f8f0;color:var(--green)}.pill.red{background:#fff0f0;color:var(--red)}.detail{min-height:520px;position:sticky;top:18px}.detail-body{padding:18px}.detail h2{font-size:20px;margin:0 0 3px}.detail h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 9px}.kv{display:grid;grid-template-columns:95px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid #f0f2f4}.kv b{font-weight:500;color:var(--muted)}.detail-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.score{display:flex;align-items:center;gap:12px}.score strong{font-size:32px;color:var(--blue)}.bar{height:7px;background:#edf0f4;border-radius:5px;flex:1}.bar i{display:block;height:100%;background:var(--blue);border-radius:5px}.danger{color:var(--red);border-color:#efd1d1}.modal{position:fixed;inset:0;z-index:20;background:#17212b70;backdrop-filter:blur(9px);display:none;align-items:center;justify-content:center;padding:24px}.modal.open{display:flex;animation:m ep.current:before{background:var(--red)}
    .progress-body{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.75fr);gap:0;border-top:1px solid var(--line)}.progress-column{padding:18px}.progress-column+.progress-column{border-left:1px solid var(--line);background:#fbfcfc}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}.section-heading h3{margin:0;font-size:13px}.status-control{display:flex;align-items:center;gap:8px}.status-control .select{width:min(260px,100%)}.progress-actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 17px}.task-stack{display:grid;gap:8px}.task-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:10px;padding:11px 12px;border:1px solid #e8ebed;border-radius:9px;background:#fff}.task-item.done{opacity:.62}.task-item.cancelled{opacity:.5;background:#f7f7f7}.task-check{width:26px;height:26px;display:grid;place-items:center;padding:0;border-radius:50%}.task-title{font-weight:700}.task-note{margin-top:3px;color:var(--muted);font-size:11px}.task-due{color:var(--muted);font-size:11px}.task-due.overdue{color:var(--red);font-weight:800}.task-actions{display:flex;gap:5px}.task-actions button{padding:5px 7px;font-size:11px}.asset-list,.timeline{display:grid;gap:8px}.asset-row{padding:9px 10px;border-radius:8px;background:#f1f4f6;font-size:12px}.asset-row a{margin-left:7px}.timeline-item{position:relative;padding:2px 0 10px 15px;border-left:1px solid #dfe4e7;color:#53606b;font-size:12px}.timeline-item:before{content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;border-radius:50%;background:#8aa8df}.timeline-time{display:block;color:#939da6;font-size:10px;margin-top:2px}.progress-empty{padding:44px;text-align:center;color:var(--muted)}

    @media(max-width:900px){.progress-summary,.progress-body{grid-template-columns:1fr}.progress-column+.progress-column{border-left:0;border-top:1px solid var(--line)}.progress-toolbar{grid-template-columns:1fr}.stage-step{font-size:0}.stage-step.current{font-size:9px}.task-item{grid-template-columns:auto 1fr}.task-actions{grid-column:2}.job-statuses{justify-content:flex-start}}

<body>
  <div class="app"><aside class="side"><div class="brand">求职工作台<small>Personal Job OS</small></div><nav class="nav"><button class="active" data-view="dashboard">⌂　今日工作台</button><button data-view="jobs">▦　岗位池</button><button data-view="progress">↗　岗位进展</button><button data-view="resumes">▤　简历资产库</button><button data-view="sources">⚙　来源与关键词</button></nav><div class="side-foot">本地单用户模式<br>AI 只做建议，提交由你确认</div></aside><main class="main"><header class="top"><div><h1 id="pageTitle">今日工作台</h1><p id="today">正在加载你的求职进展…</p></div><div class="actions"><button id="refresh">刷新</button><button class="primary" id="newJob">＋ 导入岗位</button></div></header><div class="content" id="content"></div></main></div>
  <div class="modal" id="modal"><form class="modal-card" id="jobForm"><div class="modal-header"><div><p class="modal-kicker">JOB RECORD</p><h2 id="jobFormTitle">导入岗位</h2><p class="modal-hint" id="jobFormHint">核对信息后保存，岗位会进入待人工确认队列。</p></div><button type="button" class="modal-close" id="closeModal" aria-label="关闭窗口">×</button></div><div class="modal-body"><section class="modal-section"><p class="modal-section-title">岗位来源</p><div class="url-row"><div class="field"><label>岗位 URL（可选；手动录入可留空）</label><input class="input" name="job_url" placeholder="https://…"></div><button type="button" id="parseUrl">解析 URL</button></div><div class="form-grid"><div class="field"><label>来源分类</label><select class="select" name="source_category"><option>公司官网</option><option>二级招聘平台</option><option>高校就业网</option><option>社交媒体 / 社群</option><option>内推 / 猎头</option><option selected>其他/待确认</option></select></div><div class="field"><label>具体来源</label><input class="input" name="source_name" placeholder="如：字节跳动官网 / 同学推荐"></div></div></section><section class="modal-section"><p class="modal-section-title">岗位信息</p><div class="form-grid"><div class="field"><label>公司</label><input class="input" name="company" required></div><div class="field"><label>企业性质</label><input class="input" name="company_type" list="companyTypeOptions" placeholder="如：私企 / 国企 / 央企"></div><div class="field"><label>职位</label><input class="input" name="role" required></div><div class="field"><label>地点 / 远程</label><input class="input" name="location"></div><div class="field"><label>招聘类型</label><select class="select" name="recruiting_type"><option value="">未注明</option><option>校招</option><option>社招</option><option>实习</option><option>全职</option></select></div><div class="field"><label>工作方式</label><input class="input" name="work_mode" placeholder="如：线下 / 混合 / 远程"></div><div class="field"><label>雇佣类型</label><input class="input" name="employment_type" placeholder="如：全职"></div><div class="field"><label>发布日期</label><input class="input" name="published_at" placeholder="如：2026-07-23"></div><div class="field"><label>截止日期</label><input class="input" name="deadline" placeholder="如：2026-08-10"></div><div class="field wide"><label>申请链接</label><input class="input" name="application_url" placeholder="没有则使用岗位链接"></div></div><datalist id="companyTypeOptions"><option value="私企"><option value="国企"><option value="央企"><option value="外企"><option value="合资企业"><option value="事业单位"><option value="政府机关"></datalist></section><section class="modal-section"><p class="modal-section-title">补充说明</p><div class="form-grid"><div class="field wide"><label>岗位描述（可选）</label><textarea class="textarea" name="description" rows="4"></textarea></div><div class="field wide"><label>备注</label><textarea class="textarea" name="notes" rows="3"></textarea></div></div></section></div><div class="modal-actions"><button type="button" id="cancelModal">取消</button><button class="primary" id="jobFormSubmit">保存到待确认</button></div></form></div>
  <script>
    const $ = (id) => document.getElementById(id); let jobs = [], selected = null;
    const labels = {pending_review:'待人工确认',confirmed:'已确认',rejected:'已排除',expired:'已过期'};
    const applicationLabels = {collected:'已收集',matched:'已匹配',resume_editing:'简历编辑中',resume_ready:'简历已准备',ready_to_submit:'待投递',form_filled:'表单已填写',waiting_review:'待人工确认',submitted:'已投递',hr_contacted:'HR 已联系',first_interview_invited:'一面邀请',first_interview_done:'一面完成',first_interview_passed:'一面通过',second_interview_invited:'二面邀请',second_interview_done:'二面完成',offer:'Offer',rejected:'已拒绝',withdrawn:'已撤回',no_response:'暂无回复',failed:'失败'};
    window.api = async (url, options = {}) => { const response = await fetch(url, {headers:{'content-type':'application/json'},...options}); if (!response.ok) { let message = await response.text(); try { message = JSON.parse(message).error || message; } catch {} throw Error(message); } return response.json(); };
    window.esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const formatDate = () => new Date().toLocaleDateString('zh-CN',{timeZone:'Asia/Hong_Kong',month:'long',day:'numeric',weekday:'long'});
    const statusPill = (status) => `<span class="pill ${status==='confirmed'?'green':['rejected','expired'].includes(status)?'red':'amber'}">${labels[status] || status}</span>`;
    const jobRows = (items, empty) => items.length ? items.map((job) => `<div class="job ${selected?.id === job.id?'selected':''}" data-id="${job.id}"><div class="job-row"><div><div class="job-heading"><span class="job-id">#${job.id}</span>${job.is_saved?'<span class="bookmark" title="已收藏">★</span>':''}<h3>${esc(job.role)}</h3></div><div class="company">${esc(job.company)}</div></div><div class="job-statuses">${statusPill(job.review_status)}${job.application_id?'<span class="pill blue">已进入进展</span>':''}</div></div><div class="meta"><span class="source-tag">${esc(job.source_category || '其他/待确认')}</span>${esc(job.location || '地点未注明')}　·　${esc(job.source_name || '人工导入')}${job.match_score != null ? ` · 匹配 ${Math.round(job.match_score)}%`:''}${Number(job.open_task_count)?`　·　<span class="task-hint ${job.next_task_due&&new Date(String(job.next_task_due).replace(' ','T'))<new Date()?'overdue':''}">${Number(job.open_task_count)} 项待办${job.next_task_due?` · ${esc(job.next_task_due)}`:''}</span>`:''}</div></div>`).join('') : `<div class="empty">${empty}</div>`;
    function todayMarkup(){return `<section class="today-canvas" id="todayCanvas"><article class="workboard board--queue" tabindex="0" data-board="queue"><p class="board-kicker">待确认队列</p><p class="board-count" id="todayPending">—</p><h2 class="board-title">先人工确认，再进入投递</h2><p class="board-copy">今天最值得处理的岗位会留在这里。</p><div class="board-reveal" id="todayPendingList"><div class="board-skeleton"></div><div class="board-skeleton"></div></div></article><article class="workboard board--flow" tabindex="0" data-board="flow"><p class="board-kicker">岗位进展</p><p class="board-count" id="todayApps">—</p><h2 class="board-title">进行中的申请</h2><p class="board-copy">投递状态、下一步任务和历史记录聚合在岗位下。</p><div class="board-reveal" id="todayAppsList"><div class="board-skeleton"></div></div></article><article class="workboard board--focus" tabindex="0" data-board="focus"><p class="board-kicker">今日焦点</p><p class="board-count" id="todayTasks">—</p><h2 class="board-title">待完成跟进</h2><p class="board-copy">有截止时间的事项优先浮到眼前。</p><div class="board-reveal" id="todayTasksList"><div class="board-skeleton"></div></div></article><article class="workboard board--tasks" tabindex="0" data-board="interviews"><p class="board-kicker">面试进展</p><p class="board-count" id="todayInterviews">—</p><h2 class="board-title">正在面试</h2><p class="board-copy">从投递到面试，状态始终可见。</p><div class="board-reveal"><button class="board-open" data-open-view="progress">查看岗位进展</button></div></article><article class="workboard board--resumes" tabindex="0" data-board="resumes"><p class="board-kicker">简历资产</p><p class="board-count" id="todayResumes">—</p><h2 class="board-title">可复用的材料版本</h2><p class="board-copy">需要针对岗位定制时，再从已有材料出发。</p><div class="board-reveal" id="todayResumeList"><div class="board-skeleton"></div></div></article><article class="workboard board--archive" tabindex="0" data-board="pool"><p class="board-kicker">岗位池</p><p class="board-count" id="todayJobs">—</p><h2 class="board-title">已收集岗位</h2><p class="board-copy">来源、筛选和详情维护都留在岗位池。</p><div class="board-reveal"><button class="board-open" data-open-view="jobs">进入岗位池</button></div></article></section>`}
    function jobsMarkup(){return `<section class="jobs-workspace"><div class="panel jobs-panel"><div class="panel-head"><h2>岗位池</h2><span class="muted" id="jobCount"></span></div><div class="filters"><input class="input" id="keyword" placeholder="搜索公司、职位或描述"><select class="select" id="statusFilter"><option value="">全部审核状态</option><option value="pending_review">待确认</option><option value="confirmed">已确认</option><option value="rejected">已排除</option><option value="expired">已过期</option></select><select class="select" id="savedFilter"><option value="">全部收藏状态</option><option value="yes">仅看已收藏</option><option value="no">未收藏</option></select><select class="select" id="sourceCategoryFilter"><option value="">全部来源分类</option><option>公司官网</option><option>二级招聘平台</option><option>高校就业网</option><option>社交媒体 / 社群</option><option>内推 / 猎头</option><option>其他/待确认</option></select><select class="select" id="companyTypeFilter"><option value="">全部企业性质</option><option>私企</option><option>国企</option><option>央企</option><option>外企</option><option>合资企业</option><option>事业单位</option><option>政府机关</option></select><select class="select" id="recruitingTypeFilter"><option value="">全部招聘类型</option><option>校招</option><option>社招</option><option>实习</option><option>全职</option></select><input class="input" id="locationFilter" placeholder="地点包含，如：北京 / 远程"><select class="select" id="matchFilter"><option value="">全部匹配度</option><option value="80">匹配度 ≥ 80</option><option value="60">匹配度 ≥ 60</option><option value="40">匹配度 ≥ 40</option></select><select class="select" id="applicationFilter"><option value="">全部投递关联</option><option value="no">尚未创建投递</option><option value="yes">已创建投递</option></select><select class="select" id="applicationStageFilter"><option value="">全部求职阶段</option><option value="preparing">简历准备</option><option value="ready">待投递</option><option value="submitted">已投递</option><option value="interview">面试中</option><option value="closed">已结束</option></select><select class="select" id="taskFilter"><option value="">全部任务情况</option><option value="open">有待办任务</option><option value="overdue">存在逾期</option><option value="no_next">没有下一步</option></select><select class="select" id="recentFilter"><option value="">全部时间</option><option value="7">近 7 天发布 / 发现</option><option value="30">近 30 天发布 / 发现</option></select><select class="select" id="sortFilter"><option value="id_desc">编号倒序（默认）</option><option value="newest">最新发现</option><option value="match_desc">匹配度从高到低</option><option value="deadline_asc">截止时间优先</option></select><div class="filter-actions"><button id="resetFilters">清空筛选</button><button class="primary" id="search">应用筛选</button></div></div><div class="list" id="jobs"></div></div><div class="panel detail"><div class="panel-head"><h2>岗位详情</h2><span class="muted" id="detailId">未选择</span></div><div class="detail-body" id="detail"><div class="empty">选择一个岗位查看详情、修改信息或处理下一步</div></div></div></section>`}
    function boardRows(items, empty, onClick){return items.length ? `<div class="board-list">${items.slice(0,3).map((item) => `<div class="board-item">${onClick ? `<button class="board-open" data-today-job="${item.id}">${esc(item.company)} · ${esc(item.role)}</button>`:`<b>${esc(item.name || item.title || item.role)}</b>`}<span>${esc(item.due_at || item.status || item.created_at || '')}</span></div>`).join('')}</div>` : `<p class="board-copy">${empty}</p>`}
    function attachTodayInteractions(){const canvas=$('todayCanvas'); if(!canvas)return; const cards=[...canvas.querySelectorAll('[data-board]')]; const set=(card)=>{cards.forEach((item)=>item.classList.toggle('is-active',item===card));canvas.classList.toggle('is-focusing',!!card)}; cards.forEach((card)=>{if(card.dataset.bound)return;card.dataset.bound='1';card.addEventListener('mouseenter',()=>set(card));card.addEventListener('mouseleave',()=>set(null));card.addEventListener('focusin',()=>set(card));card.addEventListener('focusout',(event)=>{if(!card.contains(event.relatedTarget))set(null)});});canvas.querySelectorAll('[data-today-job]').forEach((button)=>button.onclick=async(event)=>{event.stopPropagation();await window.showJobsDashboard();await window.showDetail(Number(button.dataset.todayJob));});canvas.querySelectorAll('[data-open-view]').forEach((button)=>{if(button.dataset.bound)return;button.dataset.bound='1';button.onclick=()=>window.navigateView(button.dataset.openView)});}
    window.showTodayDashboard=async()=>{$('content').innerHTML=todayMarkup();$('pageTitle').textContent='今日工作台';$('today').textContent=`${formatDate()} · 悬停任意板块查看今日相关内容`; $('refresh').onclick=window.loadTodayDashboard;attachTodayInteractions();await window.loadTodayDashboard();};
    window.loadTodayDashboard=async()=>{if(!$('todayCanvas'))return;const [summary,pending,tasks,applications,resumes]=await Promise.all([api('/api/dashboard/summary'),api('/api/jobs?status=pending_review&sort=newest'),api('/api/tasks'),api('/api/applications'),api('/api/resumes')]);$('todayPending').textContent=summary.pending_review;$('todayApps').textContent=summary.active_applications;$('todayTasks').textContent=summary.open_tasks;$('todayInterviews').textContent=summary.interviews;$('todayResumes').textContent=resumes.length;$('todayJobs').textContent=summary.jobs;$('todayPendingList').innerHTML=boardRows(pending,'暂时没有待确认的岗位。',true);$('todayTasksList').innerHTML=boardRows(tasks.filter((item)=>item.status==='open'),'暂无待完成任务。');$('todayAppsList').innerHTML=boardRows(applications.filter((item)=>!['offer','rejected','withdrawn','no_response','failed'].includes(item.status)),'暂无进行中的投递。');$('todayResumeList').innerHTML=boardRows(resumes,'暂无简历资产。');attachTodayInteractions();};
    function renderJobs(){const list=$('jobs');if(!list)return;list.innerHTML=jobRows(jobs,'还没有符合当前筛选的岗位');list.querySelectorAll('.job').forEach((element)=>element.onclick=()=>window.showDetail(Number(element.dataset.id)));}
    function clearDetail(message='选择一个岗位查看详情、修改信息或处理下一步'){if(!$('detail'))return;$('detailId').textContent='未选择';$('detail').innerHTML=`<div class="empty">${esc(message)}</div>`}
    window.showDetail=async(id)=>{
      selected=jobs.find((job)=>job.id===id)||selected;
      renderJobs();
      const data=await api(`/api/jobs/${id}`);
      const job=data.job;
      const application=data.applications[0];
      const tasks=data.tasks||[];
      const openTasks=tasks.filter((task)=>(task.status||(task.completed_at?'done':'open'))==='open');
      const canReview=!application;
      if(!$('detail'))return;
      $('detailId').textContent=`#${job.id}`;
      const link=job.job_url&&/^https?:/i.test(job.job_url)?`<a href="${esc(job.job_url)}" target="_blank" rel="noreferrer">打开岗位页面 ↗</a>`:'手动录入';
      const flowState=application?`<p><span class="pill blue">岗位进展 #${application.id}</span> <span class="muted">${esc(applicationLabels[application.status]||application.status)}</span></p>`:'';
      const reviewActions=canReview?`<div class="detail-actions">${job.review_status!=='confirmed'?`<button class="primary" onclick="confirmJob(${job.id})">确认岗位</button>`:''}${job.review_status==='confirmed'?`<button onclick="changeReviewStatus(${job.id},'pending_review')">改回待确认</button>`:''}${job.review_status==='rejected'?`<button onclick="changeReviewStatus(${job.id},'pending_review')">恢复待确认</button>`:''}<button onclick="saveJob(${job.id},${job.is_saved?0:1})">${job.is_saved?'取消收藏':'收藏'}</button>${job.review_status!=='rejected'?`<button class="danger" onclick="rejectJob(${job.id})">排除</button>`:''}</div>`:'';
      const progressActions=application?`${job.review_status==='rejected'&&application.status==='withdrawn'?`<button class="primary" onclick="restoreFollowUp(${job.id})">恢复跟进</button>`:!['offer','rejected','withdrawn','no_response','failed'].includes(application.status)?`<button class="danger" onclick="rejectJob(${job.id})">停止跟进并排除</button>`:''}`:'';
      const taskPreview=openTasks.length?`<div class="kv"><b>下一任务</b><span>${esc(openTasks[0].title)}${openTasks[0].due_at?` · ${esc(openTasks[0].due_at)}`:''}</span></div>`:'<p class="muted">当前没有待完成任务，可以先明确下一步。</p>';
      $('detail').innerHTML=`<h2>${esc(job.role)}</h2><div class="muted">${esc(job.company)} · ${esc(job.location||'地点未注明')}</div><div class="detail-actions"><button onclick="editJob(${job.id})">编辑岗位</button><button class="danger" onclick="deleteJob(${job.id},this)">${job.review_status==='rejected'?'彻底删除岗位':'删除岗位'}</button></div>${canReview?reviewActions:flowState}<h4>基础信息</h4><div class="kv"><b>岗位编号</b><span>#${job.id}${job.is_saved?' · 已收藏':''}</span></div><div class="kv"><b>企业性质</b><span>${esc(job.company_type||'未注明')}</span></div><div class="kv"><b>岗位来源类型</b><span>${esc(job.source_category||'其他/待确认')}</span></div><div class="kv"><b>具体来源</b><span>${esc(job.source_name||'—')} · ${esc(job.source_type||'—')}</span></div><div class="kv"><b>招聘类型</b><span>${esc(job.recruiting_type||'未注明')} · ${esc(job.work_mode||'工作方式未注明')}</span></div><div class="kv"><b>发布日期</b><span>${esc(job.published_at||'未披露')}　截止：${esc(job.deadline||'未披露')}</span></div><div class="kv"><b>链接</b><span>${link}</span></div><h4>AI 匹配建议</h4><div class="score"><strong>${job.match_score!=null?Math.round(job.match_score):'—'}</strong><div class="bar"><i style="width:${job.match_score||0}%"></i></div></div><p class="muted">${esc(job.match_reasons||'尚未分析。')}</p><h4>下一步</h4>${taskPreview}<div class="detail-actions">${job.review_status==='confirmed'&&!application?`<button onclick="convert(${job.id})">创建投递记录</button>`:''}<button onclick="addTask(${job.id},${application?.id||'null'})">添加任务</button>${progressActions}${application||tasks.length?`<button class="primary" onclick="openProgressJob(${job.id})">进入岗位进展</button>`:''}</div>`;
    };
    window.loadJobsDashboard=async()=>{if(!$('jobs'))return;const query=new URLSearchParams();[['keyword','keyword'],['statusFilter','status'],['savedFilter','saved'],['sourceCategoryFilter','source_category'],['companyTypeFilter','company_type'],['recruitingTypeFilter','recruiting_type'],['locationFilter','location'],['matchFilter','match_min'],['applicationFilter','application'],['applicationStageFilter','application_stage'],['taskFilter','task'],['recentFilter','recent_days'],['sortFilter','sort']].forEach(([id,key])=>{const value=$(id)?.value;if(value)query.set(key,value)});const items=await api(`/api/jobs?${query}`);jobs=items;$('jobCount').textContent=`${items.length} 个岗位`;renderJobs();if(selected&&items.some((job)=>job.id===selected.id))window.showDetail(selected.id);else if(selected){selected=null;clearDetail('当前岗位不在筛选结果中。清空筛选后可再次查看。')}};
    window.showJobsDashboard=async()=>{$('content').innerHTML=jobsMarkup();$('pageTitle').textContent='岗位池';$('today').textContent='默认按岗位编号倒序，状态变化不会改变岗位位置';$('search').onclick=window.loadJobsDashboard;$('resetFilters').onclick=()=>{document.querySelectorAll('.filters input,.filters select').forEach((field)=>field.value='');$('sortFilter').value='id_desc';window.loadJobsDashboard();};$('refresh').onclick=window.loadJobsDashboard;await window.loadJobsDashboard();};window.showDashboard=window.showTodayDashboard;window.loadDashboard=window.loadJobsDashboard;
    async function refreshJob(id){const scroll=$('jobs')?.scrollTop||0;await window.loadJobsDashboard();if(jobs.some((job)=>job.id===id))await window.showDetail(id);if($('jobs'))$('jobs').scrollTop=scroll}
    window.confirmJob=async(id)=>{await api(`/api/jobs/${id}/confirm`,{method:'POST'});await refreshJob(id)};
    window.changeReviewStatus=async(id,status)=>{await api(`/api/jobs/${id}`,{method:'PATCH',body:JSON.stringify({review_status:status})});await refreshJob(id)};
    window.saveJob=async(id,isSaved)=>{await api(`/api/jobs/${id}`,{method:'PATCH',body:JSON.stringify({is_saved:Boolean(isSaved)})});await refreshJob(id)};
    window.rejectJob=async(id)=>{const {applications}=await api(`/api/jobs/${id}`);const hasApplication=applications.length>0;const message=hasApplication?'停止跟进会将本地投递状态标为“已撤回”，并取消该岗位所有待完成任务；这不会替你在外部招聘网站撤回申请。是否继续？':'确认排除该岗位吗？';if(!confirm(message))return;const reason=prompt('排除原因（可选）')||(hasApplication?'不再推进该岗位':'不感兴趣');await api(`/api/jobs/${id}/reject`,{method:'POST',body:JSON.stringify({reason})});await refreshJob(id)};
    window.restoreFollowUp=async(id)=>{if(!confirm('恢复后将回到排除前的投递阶段；已取消的任务不会自动恢复。是否继续？'))return;await api(`/api/jobs/${id}/restore-follow-up`,{method:'POST',body:'{}'});await refreshJob(id)};
    window.convert=async(id)=>{const app=await api(`/api/jobs/${id}/convert-to-application`,{method:'POST',body:'{}'});alert(`已创建岗位进展 #${app.id}`);await refreshJob(id)};
    window.addTask=async(id,applicationId)=>window.openTaskModal?.({jobId:id,applicationId});
    window.openProgressJob=async(id)=>{window.pendingProgressJob=id;await window.navigateView('progress')};
    function setFormValue(name,value){const field=$('jobForm').elements.namedItem(name);if(field)field.value=value??''}function openModal(){const form=$('jobForm');form.reset();delete form.dataset.editId;$('jobFormTitle').textContent='导入岗位';$('jobFormHint').textContent='核对信息后保存，岗位会进入待人工确认队列。';$('jobFormSubmit').textContent='保存到待确认';$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}window.editJob=async(id)=>{const {job}=await api(`/api/jobs/${id}`);const form=$('jobForm');form.reset();form.dataset.editId=String(id);['company','company_type','role','job_url','application_url','source_name','location','work_mode','employment_type','recruiting_type','source_category','published_at','deadline','description','notes'].forEach((key)=>setFormValue(key,job[key]));$('jobFormTitle').textContent=`编辑岗位 #${id}`;$('jobFormHint').textContent='修改后会立即更新岗位池和岗位详情，关联的求职历史不会被覆盖。';$('jobFormSubmit').textContent='保存修改';$('modal').classList.add('open')};window.deleteJob=async(id,button)=>{if(button?.dataset.deleting==='1')return;let detail;try{detail=await api(`/api/jobs/${id}`)}catch(error){alert(`无法读取岗位信息：${error.message}`);return}const linked=detail.applications.length||detail.resumes.length||detail.tasks.length;if(linked&&detail.job.review_status!=='rejected'){alert('该岗位仍在使用中。请先在岗位进展中“停止跟进并排除”，再执行彻底删除。');return}const message=linked?'确认彻底删除该岗位吗？投递记录、事件流水和跟进任务会被删除；关联简历会保留在简历资产库中。':'确认删除此岗位吗？此操作无法撤销。';if(!confirm(message))return;const originalText=button?.textContent;if(button){button.dataset.deleting='1';button.disabled=true;button.textContent='正在删除…'}try{const result=await api(`/api/jobs/${id}`,{method:'DELETE'});selected=null;await window.loadJobsDashboard();clearDetail('岗位已删除。可从左侧选择其他岗位继续处理。');alert(result.preserved_resumes?`岗位已删除，${result.preserved_resumes} 份简历已保留在资产库。`:'岗位已删除');}catch(error){alert(`无法删除岗位：${error.message}`)}finally{if(button?.isConnected){delete button.dataset.deleting;button.disabled=false;button.textContent=originalText}}};
    async function parseUrlIntoForm(url){if(!url)return alert('请先粘贴岗位 URL');const button=$('parseUrl');button.disabled=true;button.textContent='解析中…';try{const data=await api('/api/jobs/preview-url',{method:'POST',body:JSON.stringify({job_url:url})});['company','role','location','recruiting_type','application_url'].forEach((key)=>{if(data[key])setFormValue(key,data[key])});alert(data.missing_fields?.length?`已解析部分字段，请补齐：${data.missing_fields.join('、')}`:'岗位信息解析完成，请核对后保存。')}catch(error){alert(`解析失败，请手动填写：${error.message}`)}finally{button.disabled=false;button.textContent='解析 URL'}}
    async function submitJobForm(event){event.preventDefault();const form=event.currentTarget;const data=Object.fromEntries(new FormData(form));const editId=form.dataset.editId;try{if(editId){await api(`/api/jobs/${editId}`,{method:'PATCH',body:JSON.stringify(data)});closeModal();await window.showJobsDashboard();await window.showDetail(Number(editId));}else{if(!data.job_url)data.job_url=`manual://${Date.now()}`;const job=data.job_url.startsWith('http')?await api('/api/jobs/import-url',{method:'POST',body:JSON.stringify(data)}):await api('/api/jobs',{method:'POST',body:JSON.stringify(data)});closeModal();alert(`已导入岗位 #${job.id}`);await window.showJobsDashboard();await window.showDetail(job.id)}}catch(error){alert(`保存失败：${error.message}`)}}
    $('newJob').onclick=openModal;$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('modal').onclick=(event)=>{if(event.target.id==='modal')closeModal()};$('parseUrl').onclick=()=>parseUrlIntoForm($('jobForm').elements.namedItem('job_url').value);$('jobForm').onsubmit=submitJobForm;
    window.navigateView=async(view)=>{const button=[...document.querySelectorAll('.nav button')].find((item)=>item.dataset.view===view);if(button)button.click();};window.showTodayDashboard().catch((error)=>alert(error.message));
  </script>
</body>
